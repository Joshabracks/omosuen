name: Plugin Release

# Auto-releases official plugins (under plugins/<name>/) as installable git tags:
# `npm i github:joshabracks/omosuen#<plugin><version>`. On every merge to main it
# scans each plugin's package.json version and releases ONLY those whose tag does
# not already exist — so cutting a release = bumping a plugin's version. Re-merges
# without a bump are a no-op.
#
# npm installs a `github:` ref from the REPO ROOT package.json. On normal branches
# the root is the engine (`omosuen`), so the release job synthesizes an orphan commit
# whose tree IS the plugin package (plugin at root) and tags it `<plugin><version>`
# (e.g. state-overlay0.0.1). Engine releases keep using `v*` tags — no collision.

on:
  push:
    branches: [main]
    paths: ['plugins/**']
  workflow_dispatch: {}

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      any: ${{ steps.scan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Scan plugins for unreleased versions
        id: scan
        run: |
          set -euo pipefail
          matrix='[]'
          for d in plugins/*/; do
            [ -f "${d}package.json" ] || continue
            plugin="$(basename "$d")"
            version="$(node -p "require('./${d}package.json').version")"
            tag="${plugin}${version}"
            if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
              echo "skip (exists): ${tag}"
            else
              echo "release: ${tag}"
              matrix="$(node -e "const m=JSON.parse(process.argv[1]); m.push({plugin:process.argv[2],version:process.argv[3],tag:process.argv[4]}); console.log(JSON.stringify(m))" "$matrix" "$plugin" "$version" "$tag")"
            fi
          done
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: 'Install toolchain (root devDeps: tsc/webpack/ts-loader)'
        run: npm install

      - name: Build plugin (ESM dist + browser bundle)
        working-directory: plugins/${{ matrix.plugin }}
        run: npm run build

      # Copy the standalone browser bundle to a stable path BEFORE the orphan
      # checkout rewrites the working tree, so it can be attached as a Release
      # asset (downloadable directly, like the engine's omosuen.min.js). Convention:
      # each plugin's browser bundle is dist/<plugin>.plugin.js.
      - name: Stage standalone browser bundle
        id: asset
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          SRC="plugins/${PLUGIN}/dist/${PLUGIN}.plugin.js"
          if [ -f "$SRC" ]; then
            cp "$SRC" "${RUNNER_TEMP}/${PLUGIN}.plugin.js"
            echo "path=${RUNNER_TEMP}/${PLUGIN}.plugin.js" >> "$GITHUB_OUTPUT"
            echo "staged standalone bundle: $SRC"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "no standalone bundle at $SRC — Release will have no JS asset"
          fi

      - name: Synthesize plugin-at-root tree and tag
        env:
          PLUGIN: ${{ matrix.plugin }}
          VERSION: ${{ matrix.version }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          cp -r "plugins/${PLUGIN}/." "$STAGE/"
          rm -rf "$STAGE/node_modules"
          test -f "$STAGE/package.json"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Orphan branch whose tree is exactly the plugin package.
          git checkout --orphan "release-${TAG}"
          git rm -rf . >/dev/null 2>&1 || true
          cp -r "$STAGE/." .
          rm -rf node_modules
          git add -A
          git commit -m "release: ${PLUGIN} v${VERSION}"
          git tag "$TAG"
          git push origin "refs/tags/${TAG}"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: ${{ matrix.plugin }} v${{ matrix.version }}
          files: ${{ steps.asset.outputs.path }}
          body: |
            Official Omosuen plugin component **omosuen-${{ matrix.plugin }}** v${{ matrix.version }}.

            **Standalone bundle:** download `${{ matrix.plugin }}.plugin.js` from the assets below
            (self-registering — load it after the Omosuen UMD bundle, no build step).

            Install (npm, source + ESM):
            ```
            npm i github:joshabracks/omosuen#${{ matrix.tag }}
            ```
