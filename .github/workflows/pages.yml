name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add wasm32 Rust target
        run: rustup target add wasm32-unknown-unknown
      # The site bundles test/dev/omosuen.js, which is gitignored — build it first.
      - name: Build the engine (dev bundle)
        run: |
          npm install
          npm run build:dev
      - name: Build the site
        working-directory: site
        env:
          BASE_PATH: /omosuen/
        run: |
          npm install
          npm run typecheck
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
