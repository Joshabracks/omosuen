<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omosuen Integration Test</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Courier New', monospace;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- Console Interception - MUST run before omosuen.js loads -->
    <script>
      // =========================================================================
      // Console Interception - Send all logs to test server with queue
      // =========================================================================
      (function() {
        const originalConsole = {
          log: console.log,
          info: console.info,
          warn: console.warn,
          error: console.error,
        };

        // Log queue to buffer messages
        var logQueue = [];
        var isProcessingQueue = false;

        // Process log queue sequentially
        function processLogQueue() {
          if (isProcessingQueue || logQueue.length === 0) {
            return;
          }

          isProcessingQueue = true;
          const logEntry = logQueue.shift();

          fetch('/log', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(logEntry),
          })
          .then(function() {
            isProcessingQueue = false;
            // Process next log in queue
            processLogQueue();
          })
          .catch(function(err) {
            isProcessingQueue = false;
            originalConsole.warn('[Browser] Failed to send log to server:', err.message || err);
            // Continue processing queue even on error
            processLogQueue();
          });
        }

        // Intercept console methods
        ['log', 'info', 'warn', 'error'].forEach(function(method) {
          console[method] = function() {
            // Convert arguments to array
            var args = Array.prototype.slice.call(arguments);

            // Always call original method so logs appear in browser console
            originalConsole[method].apply(console, args);

            // Format message
            var message = args
              .map(function(arg) {
                return typeof arg === 'object' ? JSON.stringify(arg) : String(arg);
              })
              .join(' ');

            // Add to queue
            logQueue.push({ level: method, message: message });

            // Start processing if not already running
            processLogQueue();
          };
        });

        // Global error handler for uncaught exceptions
        window.addEventListener('error', function(event) {
          // Build error message with stack trace
          var errorMessage = 'Uncaught ' + (event.error ? event.error.toString() : event.message);
          if (event.filename) {
            errorMessage += '\n    at ' + event.filename + ':' + event.lineno + ':' + event.colno;
          }
          if (event.error && event.error.stack) {
            errorMessage += '\n' + event.error.stack;
          }

          // Add to queue
          logQueue.push({ level: 'error', message: errorMessage });
          processLogQueue();
        });
      })();
    </script>

    <script src="dev/omosuen.js"></script>
    <script type="module">
      // =========================================================================
      // Memory Scene Definition - Green Terminal Countdown
      // =========================================================================
      const memorySceneDefinition = {
        name: 'MemoryScene',
        async build() {
          const { newComponent, registerMethod, registerHtmlConstructor } = window.Omosuen;

          const root = await newComponent('nexus', { name: 'MemorySceneRoot' });
          if (!root) {
            console.error('[Memory Scene] Failed to create root nexus');
            return null;
          }

          // State for countdown logic
          let countdown = 10;
          let accumulatedTime = 0;
          let isComplete = false;

          // Register HTML constructor for memory overlay
          registerHtmlConstructor('memoryOverlay', function(container) {
            container.innerHTML = `
              <div style="
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(180deg, #001a00 0%, #003300 100%);
                color: #00ff00;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-shadow: 0 0 10px #00ff00;
              ">
                <div style="
                  font-size: 36px;
                  margin-bottom: 40px;
                  letter-spacing: 4px;
                  opacity: 0.8;
                ">
                  [ MEMORY SCENE ]
                </div>
                <div id="countdown" style="
                  font-size: 120px;
                  font-weight: bold;
                  line-height: 1;
                ">10</div>
                <div style="
                  font-size: 24px;
                  margin-top: 40px;
                  opacity: 0.6;
                ">
                  seconds remaining...
                </div>
              </div>
            `;
          });

          // Register update method for countdown logic
          registerMethod('ui-overlay', 'memory-update', function(component, deltaTime) {
            if (isComplete) return;

            accumulatedTime += deltaTime;

            // Update countdown every 1000ms
            if (accumulatedTime >= 1000) {
              accumulatedTime -= 1000;
              countdown--;

              // Update display
              const countdownEl = document.getElementById('countdown');
              if (countdownEl) {
                countdownEl.textContent = countdown;
              }

              // Countdown complete
              if (countdown <= 0 && !isComplete) {
                isComplete = true;
                console.info('countdown complete');

                // Trigger scene switch after brief delay
                setTimeout(async () => {
                  await window.switchToDeserializedScene();
                }, 500);
              }
            }
          });

          // Create overlay with new pattern
          const overlay = await newComponent('ui-overlay', {
            name: 'MemoryOverlay',
            htmlConstructorKey: 'memoryOverlay',
            updateOverride: 'memory-update',
            cssOverrides: {
              display: 'block',
              pointerEvents: 'auto',
              zIndex: '1000',
            },
          });

          if (!overlay) {
            console.error('[Memory Scene] Failed to create overlay');
            return root;
          }

          root.addComponent(overlay);
          return root;
        }
      };

      // =========================================================================
      // Test Orchestration
      // =========================================================================
      const { init, start, switchScene, registerScene, registerSceneModule, getActiveScene, serializeComponentRecursive, deserializeComponentRecursive } =
        window.Omosuen;

      let firstSceneData = null;

      // Initialize Omosuen FIRST
      console.info('Omosuen init');
      init();

      // Start game loop
      console.info('Omosuen start');
      start(60);

      // Build memory scene (needs to happen after init)
      const memoryScene = await memorySceneDefinition.build();

      // Register integration scene module
      registerSceneModule('IntegrationScene', '/scenes/integration-scene.js');

      // Register memory scene (pre-built inline)
      registerScene('MemoryScene', memoryScene);

      // Load first scene (integration-scene.js module)
      switchScene('IntegrationScene')
        .then(() => {
          console.info('scene a loaded');
        })
        .catch((err) => {
          const errorMsg = err instanceof Error ? `${err.message}\n${err.stack}` : String(err);
          console.error(`Failed to load integration scene: ${errorMsg}`);
        });

      // Global function for "Next Scene" button
      window.onNextSceneClick = async function () {
        try {
          // Serialize current scene
          const activeScene = getActiveScene();
          if (!activeScene) {
            console.error('No active scene to serialize');
            return;
          }
          const serialized = serializeComponentRecursive(activeScene);
          console.info('scene a serialized');

          // Save to server
          await fetch('/save-scene', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(serialized),
          });

          // Unload scene A
          console.info('scene a unloaded');

          // Switch to memory scene
          await switchScene('MemoryScene');
          console.info('scene b loaded');
        } catch (err) {
          const errorMsg = err instanceof Error ? `${err.message}\n${err.stack}` : String(err);
          console.error(`Failed to switch scenes: ${errorMsg}`);
        }
      };

      // Function to switch back to deserialized scene (global so memory scene can call it)
      window.switchToDeserializedScene = async function() {
        try {
          // Unload memory scene
          console.info('scene b unloaded');

          // Load serialized scene from server
          const response = await fetch('/load-scene');
          const serializedData = await response.json();

          // Deserialize scene using recursive deserialization
          const scene = deserializeComponentRecursive(serializedData);
          console.info('scene a deserialized');

          // Load the deserialized scene
          if (scene) {
            registerScene('DeserializedScene', scene);
            await switchScene('DeserializedScene');
            console.info('scene a reloaded');
          } else {
            console.error('Failed to deserialize scene');
          }
        } catch (err) {
          const errorMsg = err instanceof Error ? `${err.message}\n${err.stack}` : String(err);
          console.error(`Failed to deserialize scene: ${errorMsg}`);
        }
      }
    </script>
  </body>
</html>
