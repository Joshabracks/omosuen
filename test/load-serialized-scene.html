<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Serialized Scene Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #00ff00;
            font-family: monospace;
            overflow: hidden;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border: 1px solid #00ff00;
            border-radius: 5px;
        }
        #controls h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 8px 16px;
            margin: 5px 5px 5px 0;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
        }
        button:hover {
            background: #00cc00;
        }
        button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        #log {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            height: 150px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #00ff00;
            padding: 10px;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.4;
            z-index: 2000;
        }
        .log-entry {
            margin: 2px 0;
        }
        .log-success { color: #00ff00; }
        .log-error { color: #ff0000; }
        .log-info { color: #00aaff; }
        .log-warn { color: #ffaa00; }
    </style>
</head>
<body>
    <div id="controls">
        <h2>Serialized Scene Loader</h2>
        <button id="loadBtn" onclick="loadScene()">Load Scene from JSON</button>
        <button id="unloadBtn" onclick="unloadScene()" disabled>Unload Scene</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <div id="log"></div>

    <script src="./dev/omosuen.js"></script>
    <script>
        const {
            registerSceneSerialized,
            switchScene,
            unloadScene: sceneUnload,
            getActiveScene,
            hasScene,
            $
        } = Omosuen;

        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${timestamp}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
            console.log(message);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
            log('Log cleared', 'info');
        }

        async function loadScene() {
            try {
                log('Starting scene load process...', 'info');

                const loadBtn = document.getElementById('loadBtn');
                const unloadBtn = document.getElementById('unloadBtn');
                loadBtn.disabled = true;

                // Register the serialized scene
                log('Registering serialized scene from /data/test-scene.json', 'info');
                registerSceneSerialized('TestScene', '/data/test-scene.json');

                // Check if registered
                if (hasScene('TestScene')) {
                    log('✓ Scene registered successfully', 'success');
                } else {
                    log('✗ Scene registration failed', 'error');
                    loadBtn.disabled = false;
                    return;
                }

                // Switch to the scene (this will load and deserialize it)
                log('Loading scene from file...', 'info');
                const scene = await switchScene('TestScene');

                if (!scene) {
                    log('✗ Failed to load scene', 'error');
                    loadBtn.disabled = false;
                    return;
                }

                log(`✓ Scene loaded successfully: ${scene.name}`, 'success');
                log(`  Scene type: ${scene.type}`, 'info');
                log(`  Child components: ${scene.components.length}`, 'info');

                // Log scene hierarchy
                scene.components.forEach(child => {
                    log(`  - ${child.name} (${child.type})`, 'info');
                    if (child.type === 'nexus' && child.components) {
                        child.components.forEach(grandchild => {
                            log(`    - ${grandchild.name} (${grandchild.type})`, 'info');
                        });
                    }
                });

                // Check for UI Overlay
                const uiLayer = scene.components.find(c => c.name === 'UILayer');
                if (uiLayer && uiLayer.type === 'nexus') {
                    const overlay = uiLayer.components.find(c => c.type === 'ui-overlay');
                    if (overlay) {
                        log('✓ UI Overlay found and should be visible', 'success');
                    }
                }

                // Enable unload button
                unloadBtn.disabled = false;

                log('Scene load complete!', 'success');
                log('The UI Overlay should now be visible on screen', 'info');

            } catch (error) {
                log(`✗ Error loading scene: ${error.message}`, 'error');
                console.error(error);
                document.getElementById('loadBtn').disabled = false;
            }
        }

        function unloadScene() {
            try {
                log('Unloading scene...', 'info');

                const activeScene = getActiveScene();
                if (!activeScene) {
                    log('No active scene to unload', 'warn');
                    return;
                }

                log(`Disposing scene: ${activeScene.name}`, 'info');
                sceneUnload();

                log('✓ Scene unloaded successfully', 'success');
                log('UI Overlay should be removed from DOM', 'info');

                // Update buttons
                document.getElementById('loadBtn').disabled = false;
                document.getElementById('unloadBtn').disabled = true;

            } catch (error) {
                log(`✗ Error unloading scene: ${error.message}`, 'error');
                console.error(error);
            }
        }

        // Initialize
        log('Omosuen Scene Loader Ready', 'success');
        log('Click "Load Scene from JSON" to load the serialized scene', 'info');
        log('The scene file is at: /data/test-scene.json', 'info');
    </script>
</body>
</html>
